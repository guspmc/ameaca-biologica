name: Testes
on:
  push:
    branches:
      - main
      - jill/painel-do-mestre
  pull_request:
    branches:
      - main
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar testes
        run: npm test
